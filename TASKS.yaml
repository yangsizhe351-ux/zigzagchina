      - main_branch
      - exact_head
      - worktree_state
      - task_ledger
      - handoff
  stop_conditions:
    - unknown_dirty_changes
    - project_binding_mismatch
    - head_or_branch_mismatch
    - successor_not_ready

model_escalation_policy:
  first_same_ac_failure:
    action: ROOT_CAUSE_RETRY
    keep_or_raise_model: true
    raise_reasoning_effort: true
  second_same_ac_failure:
    action: REFRAME_OR_SPLIT
    raise_model_profile: true
    require_clean_context: true
  third_same_ac_failure:
    action: BLOCK_AND_ARCHITECTURE_REVIEW
    status: BLOCKED
    default_profile: frontier_gate
    default_reasoning_effort: xhigh
    max_allowed_only_when:
      priority: P0
      root_cause: UNKNOWN

execution_efficiency_policy:
  context_loading:
    initial_full_reads_per_turn: 1
    subsequent_reads: targeted_ranges_or_diff
    full_reread_only_when:
      - head_changed
      - relevant_governance_file_changed
      - context_compacted
  qa_routing:
    final_owner_per_candidate: 1
    same_sha_repeat_forbidden: true
    repeat_allowed_when:
      - candidate_sha_changed
      - acceptance_criteria_changed
      - prior_result_incomplete_or_unavailable
    qa_starts_after_candidate_frozen: true
  waiting:
    immediate_snapshot_limit: 1
    mode: event_driven
    minimum_bounded_wait_seconds: 120
    reuse_cursor_after_timeout: true
  handoff_packet:
    required_fields:
      - issue_id
      - base_sha
      - candidate_sha
      - changed_paths
      - failed_ac_or_result
      - next_action
    resend_full_documents_or_logs: false
  validation:
    mechanical_preflight_by_owner: true
    smallest_relevant_check_first: true
    full_matrix_runs_per_final_candidate: 1
    efficiency_must_not_lower_risk_gate: true

