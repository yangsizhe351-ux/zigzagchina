  health_signals:
    - conversation_context_compacted
    - repeated_state_reconstruction
    - two_consecutive_context_omissions_or_contradictions
    - user_reports_lag_or_context_overuse
  warning_action: 更新 HANDOFF.md 并提醒用户可交接。
