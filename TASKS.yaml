control_handoff_policy:
  skill: control-context-handoff
  standing_authorization:
    granted: true
    granted_at: "2026-08-31T11:57:58+08:00"
    scope: zigzag_control_thread_only
    create_successor_in_saved_project: true
    archive_predecessor_after_successor_ready: true
    push_or_deploy: false
    delete_branch_or_worktree: false
  health_signals:
    - conversation_context_compacted
    - repeated_state_reconstruction
    - two_consecutive_context_omissions_or_contradictions
    - user_reports_lag_or_context_overuse
  warning_action: 更新 HANDOFF.md 并提醒用户可交接。
  automatic_action: 形成安全检查点，创建并核验项目内继任总控，更新台账后可恢复归档旧总控。
  successor_requirements:
    project_binding: Zigzag
    workspace_mode: local_main
    model: gpt-5.6-sol
    reasoning_effort: high
    must_verify:
      - absolute_project_path
      - main_branch
      - exact_head
      - worktree_state
      - task_ledger
      - handoff
  stop_conditions:
    - unknown_dirty_changes
    - project_binding_mismatch
    - head_or_branch_mismatch
    - successor_not_ready

model_escalation_policy:
  first_same_ac_failure:
    action: ROOT_CAUSE_RETRY
    keep_or_raise_model: true
    raise_reasoning_effort: true
  second_same_ac_failure:
    action: REFRAME_OR_SPLIT
    raise_model_profile: true
    require_clean_context: true
  third_same_ac_failure:
    action: BLOCK_AND_ARCHITECTURE_REVIEW
    status: BLOCKED
    default_profile: frontier_gate
    default_reasoning_effort: xhigh
    max_allowed_only_when:
      priority: P0
      root_cause: UNKNOWN

