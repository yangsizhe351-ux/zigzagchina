<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07131a" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="The requested page could not be found." />
    <title>Page Not Found | Zigzag China</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; background: #07131a; color: #f3ead8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 20% 10%, #143c3a 0, #07131a 55%); }
      main { width: min(42rem, calc(100% - 3rem)); padding: 4rem 0; }
      p { color: #a9b8b3; font: 0.95rem/1.7 system-ui, sans-serif; }
      .code { color: #d29b63; font: 700 0.8rem/1 system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; }
      h1 { margin: 1rem 0; font-size: clamp(3rem, 10vw, 6rem); font-weight: 400; line-height: 0.95; }
      a { display: inline-block; margin-top: 1.25rem; padding-bottom: 0.35rem; color: #f3ead8; border-bottom: 1px solid #d29b63; font: 700 0.8rem/1 system-ui, sans-serif; letter-spacing: 0.12em; text-decoration: none; text-transform: uppercase; }
      a:focus-visible { outline: 2px solid #f3ead8; outline-offset: 6px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · Page not found</p>
      <h1>This path ends here.</h1>
      <p>The page you requested does not exist. Return to Zigzag China to explore Chengdu and Chongqing.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
